[project]
name = "amc-project"
version = "0.1.0"
description = "Collection and classification tools for AMC: YouTube, job ads (KPRM, Hacker News) and Wykop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1.5",
    "pandas>=2.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32.4,<3",
    "streamlit>=1.40,<2",
    "youtube-transcript-api>=1.2,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "ruff==0.11.13",
]
# Stage 2 BERT classifier (scripts/wykop/train_bert.py): uv sync --group bert
# torch is the CUDA 12.6 build (NVIDIA GPU, e.g. RTX 40xx); it also runs, slowly, on CPU.
bert = [
    "torch>=2.6,<3",
    "sacremoses>=0.1",
    "transformers>=4.46,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
